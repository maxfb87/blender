name: Build Blender (lite)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ubuntu:22.04

    steps:

      - name: Installa git (necessario per il checkout con submodules)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - name: Checkout del fork
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Installa le dipendenze di sistema per la build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y software-properties-common ca-certificates gnupg dirmngr
          add-apt-repository ppa:ubuntu-toolchain-r/test -y
          apt-get update
          apt-get install -y \
            build-essential git-lfs subversion cmake ninja-build \
            gcc-14 g++-14 \
            libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxinerama-dev libegl-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libdbus-1-dev linux-libc-dev

      - name: Configura git safe.directory
        run: git config --global --add safe.directory '*'

      - name: make update (scarica librerie precompilate + submodule)
        run: make update

      - name: make lite (build vera e propria)
        env:
          CC: gcc-14
          CXX: g++-14
          BUILD_CMAKE_ARGS: "-DWITH_GHOST_X11=ON -DWITH_X11_XINPUT=ON -DWITH_GHOST_WAYLAND=OFF"
        run: make lite

      - name: Prepara l'archivio dell'eseguibile
        run: |
          tar -cJf "$GITHUB_WORKSPACE/blender-lite-linux-x86_64.tar.xz" -C ../build_linux_lite/bin .

      - name: Carica come artifact (sempre, utile per testare)
        uses: actions/upload-artifact@v4
        with:
          name: blender-lite-linux
          path: blender-lite-linux-x86_64.tar.xz

      - name: Crea la Release (solo quando pushi un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: blender-lite-linux-x86_64.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
