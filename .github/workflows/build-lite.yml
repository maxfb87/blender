name: Build Blender (lite)

on:
  workflow_dispatch:      # permette di avviarlo manualmente da GitHub
  push:
    tags:
      - 'v*'              # si avvia automaticamente quando pushi un tag tipo v1.0

jobs:
  build-linux-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout del fork
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Installa le dipendenze di sistema per la build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git git-lfs subversion cmake ninja-build \
            gcc-14 g++-14 \
            libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxinerama-dev libegl-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libdbus-1-dev linux-libc-dev

      - name: make update (scarica librerie precompilate + submodule)
        run: make update

      - name: make lite (build vera e propria)
        env:
          CC: gcc-14
          CXX: g++-14
        run: make lite

      - name: Prepara l'archivio dell'eseguibile
        run: |
          # creo l'archivio DENTRO la cartella del repo (workspace), non un livello sopra,
          # perché upload-artifact non accetta più percorsi con ".."
          tar -cJf "$GITHUB_WORKSPACE/blender-lite-linux-x86_64.tar.xz" -C ../build_linux_lite/bin .

      - name: Carica come artifact (sempre, utile per testare)
        uses: actions/upload-artifact@v4
        with:
          name: blender-lite-linux
          path: blender-lite-linux-x86_64.tar.xz

      - name: Crea la Release (solo quando pushi un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: blender-lite-linux-x86_64.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Carica come artifact (sempre, utile per testare)
        uses: actions/upload-artifact@v4
        with:
          name: blender-lite-linux
          path: ../blender-lite-linux-x86_64.tar.xz

      - name: Crea la Release (solo quando pushi un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ../blender-lite-linux-x86_64.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
